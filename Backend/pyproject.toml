[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "educonsultant-backend"
version = "0.1.0"
description = "EduConsultant Backend API"
authors = [
    {name = "Senior Backend Engineer"}
]
readme = "README.md"
requires-python = ">=3.10"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = [
    "tests",
]
pythonpath = [
    ".",
]

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"

[tool.ruff.lint]
ignore = ["B008"]

[tool.mypy]
plugins = ["pydantic.mypy"]

